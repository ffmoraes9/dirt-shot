<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let srng=Math.random;
const sr=(a,b)=>a+srng()*(b-a), spick=a=>a[(srng()*a.length)|0];
const R=Math.random, rr=(a,b)=>a+R()*(b-a), pick=a=>a[(R()*a.length)|0];

// ---------------------------------------------------------------- constantes
const WW=1960, WH=800, X0=80, X1=1880, P=160, TICK=18;
const DSC=3;
const distM=y=>DSC*Math.round(Math.max(100,Math.min(420,300-(y-440))));
const hrOf=s=>Math.max(7,26*s);


// ---------------------------------------------------------------- canvas
const cv=$('#c'), ctx=cv.getContext('2d');
let VW=1280, VH=720, S=1, PORT=false;
const TOUCHUA=(()=>{try{const u=navigator.userAgent||'';return /iPhone|iPad|iPod|Android|Mobile/i.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}catch(e){return false}})();
let DEV='';try{DEV=localStorage.getItem('ds_dev2')||''}catch(e){}
const AUTOPC=(()=>{if(TOUCHUA)return false;try{return matchMedia('(hover:hover) and (pointer:fine)').matches}catch(e){return false}})();
let DESK=DEV?DEV==='pc':AUTOPC;
function viewSize(){const vv=window.visualViewport;let w=innerWidth,h=innerHeight;if(vv&&vv.width>50&&vv.height>50){w=Math.round(vv.width);h=Math.round(vv.height)}return {w,h}}
const DBGON=/debug/.test(location.search);
const BUILD='4.1.2';
setTimeout(()=>{try{fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const BUILD='([^']+)'/);if(m&&m[1]!==BUILD){let done=false;try{done=sessionStorage.getItem('ds_rl')===m[1]}catch(e){}if(!done){try{sessionStorage.setItem('ds_rl',m[1])}catch(e){}location.replace(location.pathname+'?v='+m[1]+(DBGON?'&debug':''))}}}).catch(()=>{})}catch(e){}},1500);
let lastVS='';
let AIM='stick';try{AIM=localStorage.getItem('ds_aim')||'stick'}catch(e){}
const aimStick=()=>!DESK&&AIM==='stick';
function stickGeo(){if(PORT)return {cx:170,cy:VH-190,R:110};const m=VW>1400?250:190;return {cx:m,cy:VH-170,R:105}}
const inStick=p=>{const G=stickGeo();return Math.hypot(p.x-G.cx,p.y-G.cy)<=G.R*1.45};
function stickSet(p){const G=stickGeo();let dx=p.x-G.cx,dy=p.y-G.cy;const m=Math.hypot(dx,dy);if(m>G.R){dx*=G.R/m;dy*=G.R/m}g.stick={dx,dy}}
let DBG=null;
const lowC=mkc(200,120), lowX=lowC.getContext('2d');
const holeC=mkc(160,120), holeX=holeC.getContext('2d');
let wallC=null;
function resize(){
  const vs=viewSize(),dpr=Math.min(2,window.devicePixelRatio||1);let cw=vs.w,ch=vs.h,ox=0;
  lastVS=vs.w+'x'+vs.h;
  if(DESK&&!TOUCHUA&&cw/ch>16/9){cw=Math.round(ch*16/9);ox=Math.round((vs.w-cw)/2)}
  cv.style.left=ox+'px';cv.style.top='0px';cv.style.width=cw+'px';cv.style.height=ch+'px';
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  PORT=ch>cw*1.05;
  if(PORT){S=cv.width/720;VW=720;VH=cv.height/S}else{S=cv.height/720;VW=cv.width/S;VH=720}
  lowC.width=Math.ceil(VW*.3);lowC.height=Math.ceil(VH*.3);
  $('#rot').style.display='none';
  buildWall();
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>{[60,250,600,1200,2200].forEach(t=>setTimeout(resize,t))});
try{if(window.visualViewport)visualViewport.addEventListener('resize',resize)}catch(e){}

// ---------------------------------------------------------------- arte procedural
const col=(r,g,b)=>[r,g,b];
const css=(c,k=1,a=1)=>`rgba(${Math.min(255,c[0]*k)|0},${Math.min(255,c[1]*k)|0},${Math.min(255,c[2]*k)|0},${a})`;
const RUST=[col(128,66,38),col(142,78,44),col(112,64,46),col(150,86,48),col(98,64,52)];
const METAL=[col(112,110,104),col(126,123,115),col(92,93,94),col(138,132,120),col(80,76,70)];
const BAGC=[col(200,194,170),col(138,154,122),col(170,124,106),col(125,143,163),col(176,162,138),col(72,74,72),col(154,143,94)];
const CARC=[col(132,70,44),col(88,104,120),col(140,132,108),col(104,90,76),col(120,60,52)];
function rustSpots(c,x,y,w,h){for(let i=0;i<5;i++){c.fillStyle=`rgba(${100+srng()*40|0},${50+srng()*20|0},24,${.18+srng()*.2})`;c.beginPath();c.ellipse(x+srng()*w,y+srng()*h,w*(.04+srng()*.1),h*(.03+srng()*.08),srng()*3,0,6.3);c.fill()}}
function tire(c,x,y,r){
  c.save();c.translate(x,y);
  const g=c.createRadialGradient(-r*.25,-r*.3,r*.1,0,0,r*1.05);g.addColorStop(0,'#46433f');g.addColorStop(1,'#101010');
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,6.3);c.fill();
  c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=Math.max(1,r*.09);
  for(let i=0;i<20;i++){const a=i*.314;c.beginPath();c.moveTo(Math.cos(a)*r*.8,Math.sin(a)*r*.8);c.lineTo(Math.cos(a)*r*.98,Math.sin(a)*r*.98);c.stroke()}
  c.fillStyle='#6d6b66';c.beginPath();c.arc(0,0,r*.5,0,6.3);c.fill();
  c.fillStyle='#232220';c.beginPath();c.arc(0,0,r*.4,0,6.3);c.fill();
  c.fillStyle='#55534f';c.beginPath();c.arc(0,0,r*.12,0,6.3);c.fill();
  c.restore();}
function barrel(c,x,y,w,h,k){
  c.save();c.translate(x,y);
  const g=c.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,css(k,.55));g.addColorStop(.35,css(k,1.05));g.addColorStop(1,css(k,.45));
  c.fillStyle=g;c.fillRect(-w/2,-h,w,h);
  c.fillStyle=css(k,.8);c.beginPath();c.ellipse(0,-h,w/2,w*.16,0,0,6.3);c.fill();
  c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(0,0,w/2,w*.14,0,0,3.15);c.fill();
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=Math.max(1,w*.045);
  for(const q of[.25,.5,.78]){c.beginPath();c.moveTo(-w/2,-h*q);c.lineTo(w/2,-h*q);c.stroke()}
  rustSpots(c,-w/2,-h,w,h);c.restore();}
function bag(c,x,y,r,k){
  c.save();c.translate(x,y);
  const g=c.createRadialGradient(-r*.3,-r*.5,r*.1,0,0,r*1.1);g.addColorStop(0,css(k,1.2));g.addColorStop(1,css(k,.55));
  c.fillStyle=g;c.beginPath();c.ellipse(0,-r*.55,r,r*.7,0,0,6.3);c.fill();
  c.beginPath();c.moveTo(-r*.15,-r*1.2);c.lineTo(0,-r*1.5);c.lineTo(r*.2,-r*1.2);c.fill();
  c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=1;c.beginPath();c.moveTo(-r*.6,-r*.5);c.quadraticCurveTo(0,-r*.2,r*.6,-r*.6);c.stroke();
  c.restore();}
function plate(c,x,y,w,h,ang,k){
  c.save();c.translate(x,y);c.rotate(ang);
  const g=c.createLinearGradient(0,-h,0,0);g.addColorStop(0,css(k,1.15));g.addColorStop(1,css(k,.6));
  c.fillStyle=g;c.fillRect(-w/2,-h,w,h);
  c.strokeStyle='rgba(0,0,0,.28)';c.lineWidth=1.2;
  for(let i=1;i<10;i++){c.beginPath();c.moveTo(-w/2+w*i/10,-h);c.lineTo(-w/2+w*i/10,0);c.stroke()}
  rustSpots(c,-w/2,-h,w,h);c.restore();}
function slab(c,x,y,w,h,ang){
  c.save();c.translate(x,y);c.rotate(ang);
  const g=c.createLinearGradient(0,-h,0,0);g.addColorStop(0,'#a8a499');g.addColorStop(1,'#6c6961');
  c.fillStyle=g;c.beginPath();c.moveTo(-w/2,0);c.lineTo(-w/2+w*.05,-h);c.lineTo(w/2-w*.1,-h*.92);c.lineTo(w/2,0);c.closePath();c.fill();
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1.3;c.beginPath();c.moveTo(-w*.2,-h);c.lineTo(-w*.05,-h*.5);c.lineTo(-w*.18,0);c.stroke();
  c.strokeStyle='#5a3a26';c.lineWidth=1.6;for(let i=0;i<3;i++){const px=-w/2+w*(.2+.3*i);c.beginPath();c.moveTo(px,-h);c.lineTo(px+(srng()-.5)*6,-h-h*.35);c.stroke()}
  c.restore();}
function bricks(c,x,y,w,h){for(let i=0;i<w*h/55;i++){const bx=x+srng()*w,by=y-srng()*h;c.fillStyle=`rgb(${150+srng()*40|0},${74+srng()*20|0},${52+srng()*16|0})`;c.save();c.translate(bx,by);c.rotate((srng()-.5)*.7);c.fillRect(-5,-2.5,10,5);c.restore()}}
function wire(c,x,y,w,h){c.strokeStyle='rgba(30,26,22,.8)';c.lineWidth=1.1;for(let i=0;i<22;i++){c.beginPath();c.moveTo(x+srng()*w,y-srng()*h);c.bezierCurveTo(x+srng()*w,y-srng()*h,x+srng()*w,y-srng()*h,x+srng()*w,y-srng()*h);c.stroke()}}
function plank(c,x,y,len,ang){c.save();c.translate(x,y);c.rotate(ang);c.fillStyle=css(col(120,92,62),.8+srng()*.4);c.fillRect(-len/2,-4,len,7);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(-len/2,1,len,2);c.restore()}
function car(c,x,y,w,k,flip){
  const h=w*.42;c.save();c.translate(x,y);if(flip)c.scale(-1,1);
  c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(0,0,w*.54,h*.12,0,0,6.3);c.fill();
  const g=c.createLinearGradient(0,-h,0,0);g.addColorStop(0,css(k,1.15));g.addColorStop(1,css(k,.5));
  c.fillStyle=g;c.beginPath();c.moveTo(-w/2,-h*.2);c.lineTo(-w/2,-h*.52);c.lineTo(-w*.32,-h*.58);c.lineTo(-w*.2,-h*.95);c.lineTo(w*.18,-h*.95);c.lineTo(w*.32,-h*.58);c.lineTo(w/2,-h*.5);c.lineTo(w/2,-h*.2);c.closePath();c.fill();
  c.fillStyle='rgba(18,20,20,.88)';c.beginPath();c.moveTo(-w*.17,-h*.6);c.lineTo(-w*.1,-h*.88);c.lineTo(w*.13,-h*.88);c.lineTo(w*.24,-h*.6);c.closePath();c.fill();
  c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=1;c.beginPath();c.moveTo(-w*.05,-h*.6);c.lineTo(w*.02,-h*.86);c.stroke();
  rustSpots(c,-w/2,-h,w,h*.8);
  tire(c,-w*.3,-h*.15,h*.27);tire(c,w*.3,-h*.15,h*.27);c.restore();}
function haze(c,a,colr){c.globalCompositeOperation='source-atop';c.fillStyle=colr||`rgba(216,200,164,${a})`;c.fillRect(0,0,WW,WH);c.globalCompositeOperation='source-over'}
function junk(c,type,x,y,sc,far){
  switch(type){
    case 0:tire(c,x,y-14*sc,sr(13,22)*sc);break;
    case 1:barrel(c,x,y,sr(22,32)*sc,sr(32,44)*sc,spick(RUST));break;
    case 2:bag(c,x,y,sr(14,22)*sc,spick(BAGC));break;
    case 3:plate(c,x,y,sr(34,62)*sc,sr(18,40)*sc,sr(-.6,.6),spick(METAL.concat(RUST)));break;
    case 4:car(c,x,y,sr(100,150)*sc,spick(CARC),srng()<.5);break;
    case 5:bricks(c,x-20*sc,y,sr(36,60)*sc,sr(14,24)*sc);break;
    case 6:slab(c,x,y,sr(40,80)*sc,sr(24,46)*sc,sr(-.25,.25));break;
    case 7:wire(c,x-30*sc,y,60*sc,sr(18,36)*sc);break;
    default:plank(c,x,y-6,sr(40,80)*sc,sr(-.9,.9));
  }}
function heap(c,x,y,w,h,k){
  const g=c.createLinearGradient(0,y-h,0,y);g.addColorStop(0,css(k,1.1));g.addColorStop(1,css(k,.6));
  c.fillStyle=g;c.beginPath();c.moveTo(x-w/2,y);
  const n=9;for(let i=0;i<=n;i++){const px=x-w/2+w*i/n,py=y-h*Math.sin(Math.PI*i/n)*(.7+srng()*.4);c.lineTo(px,py)}
  c.lineTo(x+w/2,y);c.closePath();c.fill();}
function grain(c,w,h,n,a){for(let i=0;i<n;i++){c.fillStyle=`rgba(${srng()<.5?0:255},${srng()<.5?0:255},0,${a})`;c.fillRect(srng()*w,srng()*h,1.5,1.5)}}

let L={bg:null,far:null,midBack:null,midFront:null,near:null}, HID=[], LM=[];
const LMN2=['o carro vermelho','o sofá rosa','o moinho','a TV velha','a bicicleta','o fogão','a porta azul','o ônibus amarelo','o carrinho de supermercado','a placa de trânsito','o ursinho de pelúcia','a banheira'];
const LMN=['o pneu','a pilha de pneus','o saco preto','o saco azul','a lona azul','a lona enrolada','o barril enferrujado','o palete','o colchão','a geladeira','as caixas de papelão','a máquina de lavar'];
function buildSceneProc(seed){
  srng=mulberry32(seed);
  // --- fundo
  const bg=mkc(WW,WH),b=bg.getContext('2d');
  let g=b.createLinearGradient(0,0,0,360);g.addColorStop(0,'#aebcc2');g.addColorStop(.7,'#dcd5bd');g.addColorStop(1,'#e8d9b0');
  b.fillStyle=g;b.fillRect(0,0,WW,360);
  g=b.createLinearGradient(0,330,0,WH);g.addColorStop(0,'#cdb88c');g.addColorStop(1,'#8d7650');b.fillStyle=g;b.fillRect(0,330,WW,WH-330);
  for(let l=0;l<3;l++){b.fillStyle=`rgba(${190-l*14},${170-l*14},${130-l*12},${.55})`;b.beginPath();b.moveTo(0,360);let ph=srng()*6;for(let x=0;x<=WW;x+=20)b.lineTo(x,330+l*10-Math.sin(x*.004+ph+l)*18-Math.sin(x*.011+ph)*6);b.lineTo(WW,380);b.lineTo(0,380);b.fill()}
  // sol/halo
  g=b.createRadialGradient(1500,120,10,1500,120,420);g.addColorStop(0,'rgba(255,248,220,.7)');g.addColorStop(1,'rgba(255,248,220,0)');b.fillStyle=g;b.fillRect(0,0,WW,500);
  L.bg=bg;
  // --- longe
  const far=mkc(WW,WH),f=far.getContext('2d');
  for(let y=350;y<=450;y+=5){const sc=lerp(.25,.5,(y-350)/100);for(let i=0;i<9;i++){junk(f,[0,1,2,3,5,6,8][(srng()*7)|0],sr(X0-60,X1+60),y,sc,true)}}
  for(let i=0;i<14;i++)heap(f,sr(0,WW),sr(380,450),sr(120,260),sr(14,34),col(120,106,90));
  haze(f,.55);L.far=far;

let wallV={}, wallH={}, segW=900;
function buildWall(){
  if(NEWW()){const G=mGeo();segW=G.sW;['alto','quebrado','buraco'].forEach(k=>{wallH[k]=G.hImg});return}
  segW=Math.ceil(VW*(PORT?1.3:.82));
  if(ART.ready){
    ['alto','quebrado','buraco'].forEach((kind,i)=>{const im=ART.img['wall'+i],h=Math.round(segW*im.height/im.width),cc=mkc(segW,h);cc.getContext('2d').drawImage(im,0,0,segW,h);wallV[kind]=cc;wallH[kind]=h});
    return;
  }
  buildWallProc();

function buildWallProc(){
  const w=segW,h=420;
  for(const kind of ['alto','quebrado','buraco']){
    srng=mulberry32(kind==='alto'?11:kind==='quebrado'?22:33);
    const cc=mkc(w,h),c=cc.getContext('2d');
    const top=x=>{let y=24+srng()*16+Math.sin(x*.012)*5;if(kind==='quebrado'){const t=(x-w*.26)/(w*.48);if(t>0&&t<1){const d=Math.min(1,Math.sin(t*Math.PI)*2.4);y=lerp(y,175+srng()*14,d)}}return y};
    let g2=c.createLinearGradient(0,0,0,h);g2.addColorStop(0,'#aaa69b');g2.addColorStop(1,'#5e5b54');
    c.fillStyle=g2;c.beginPath();c.moveTo(0,h);
    for(let x=0;x<=w;x+=12)c.lineTo(x,top(x));
    c.lineTo(w,h);c.closePath();c.fill();
    // lajes
    c.strokeStyle='rgba(30,28,24,.4)';c.lineWidth=2;
    for(let x=w*.3;x<w;x+=w*.34){c.beginPath();c.moveTo(x,180);c.lineTo(x+srng()*10-5,h);c.stroke()}
    c.lineWidth=1.5;for(let i=0;i<8;i++){let x=srng()*w,y=190+srng()*80;c.beginPath();c.moveTo(x,y);for(let k=0;k<6;k++){x+=srng()*40-20;y+=srng()*30+8;c.lineTo(x,y)}c.stroke()}
    for(let i=0;i<30;i++){c.fillStyle=`rgba(40,34,26,${.03+srng()*.05})`;c.beginPath();c.ellipse(srng()*w,120+srng()*(h-120),20+srng()*80,10+srng()*40,0,0,6.3);c.fill()}
    for(let i=0;i<10;i++){const x=srng()*w,y=190+srng()*(h-230),r=3+srng()*5;const rg=c.createRadialGradient(x,y,0,x,y,r*2.2);rg.addColorStop(0,'rgba(10,8,6,.95)');rg.addColorStop(.5,'rgba(25,22,18,.8)');rg.addColorStop(1,'rgba(25,22,18,0)');c.fillStyle=rg;c.beginPath();c.arc(x,y,r*2.2,0,6.3);c.fill()}
    // vergalhões no topo
    c.strokeStyle='#6a3e22';c.lineWidth=3;for(let x=24;x<w;x+=w/9+srng()*40){const ty=top(x);c.beginPath();c.moveTo(x,ty+4);c.lineTo(x+srng()*8-4,ty-8-srng()*10);c.stroke()}
    // costura do trecho
    c.fillStyle='rgba(10,8,6,.5)';c.fillRect(0,40,3,h);c.fillRect(w-3,40,3,h);
    if(kind==='buraco'){
      const hx=w*.5,hy=170;const rg=c.createRadialGradient(hx,hy,6,hx,hy,60);rg.addColorStop(0,'rgba(0,0,0,.95)');rg.addColorStop(.7,'rgba(20,18,14,.9)');rg.addColorStop(1,'rgba(20,18,14,0)');
      c.fillStyle=rg;c.beginPath();c.ellipse(hx,hy,62,44,-.1,0,6.3);c.fill();
    }
    wallV[kind]=cc;wallH[kind]=h;
  }
}
